  <style>

    :root {
        --teal-main: #568687;
        --teal-accent: #58687a;
        --light-blue: #cde1ec;
        --dark: #1f2933;
        --white: #ffffff;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--light-blue);
        color: var(--dark);
    }

    .container {
        width: 90%;
        max-width: 1100px;
        margin: auto;
    }

    /* NAVBAR */

    .navbar {
        background: var(--teal-main);
    }

    .nav-wrapper {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 0;
    }

    .nav-menu {
        list-style: none;
        display: flex;
        gap: 20px;
        margin: 0;
        padding: 0;
    }

    .nav-link {
        color: var(--white);
        text-decoration: none;
    }

    .nav-link.active {
        color: var(--white);
        font-weight: bold;
    }

    .logo a {
        color: var(--white);
        font-weight: bold;
        font-size: 50px;
        text-decoration: none;
    }

    /* BLOG SECTION */

    section{
      padding:60px 0;
    }

    .section-title{
      font-size:36px;
      margin-bottom:35px;
      color:teal;
      position:relative;
    }

    .section-title::after{
      content:'';
      width:80px;
      height:4px;
      background:var(--teal-main);
      position:absolute;
      left:0;
      bottom:-10px;
      border-radius:20px;
    }

    /* BLOG GRID */

    .blog-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:30px;
    }

    /* BLOG CARD */

    .blog-card{
      background:white;
      border-radius:20px;
      overflow:hidden;
      transition:0.4s;
      box-shadow:0 10px 25px rgba(0,0,0,0.15);
    }

    .blog-card:hover{
      transform:translateY(-10px);
    }

    .blog-card img{
      width:100%;
      height:240px;
      object-fit:cover;
    }

    .blog-content{
      padding:22px;
    }

    .date{
      font-size:14px;
      color:#555;
      margin-bottom:10px;
    }

    .blog-title{
      font-size:22px;
      font-weight:600;
      margin-bottom:20px;
      line-height:1.4;
    }

    .read-btn{
      display:inline-block;
      padding:12px 24px;
      border-radius:6px;
      background:var(--teal-accent);
      color:var(--white);
      font-weight:600;
      text-decoration:none;
      transition:0.3s;
    }

    .read-btn:hover{
      opacity:0.9;
    }

    /* FOOTER */

    .footer {
       background: #568687;
       color: white;
       padding: 20px 0;
       margin-top: 50px;
    }

    .footer-links a {
        color: var(--white);
        margin: 0 10px;
        text-decoration: none;
    }

    /* RESPONSIVE */

    @media(max-width:768px){

      .nav-wrapper{
        flex-direction:column;
        gap:20px;
      }

      .nav-menu{
        flex-wrap:wrap;
        justify-content:center;
      }

      .section-title{
        font-size:28px;
      }

      .footer .container{
        flex-direction:column !important;
        gap:20px;
        text-align:center;
      }
    }

  </style>
